<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07080c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="一个打开就能看见自己意图的封面页" />
    <title>Intent Anchor</title>
    <style>
      /* 启动兜底：JS 未成功执行时也能给用户一条出路（真白屏的最后一道防线） */
      #boot-fallback {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: #f4f2ec;
        color: #2c2a26;
        font-family: 'DM Sans', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      #boot-fallback[hidden] {
        display: none;
      }
      #boot-fallback .bf-card {
        width: 100%;
        max-width: 380px;
        padding: 22px 20px;
        border-radius: 20px;
        border: 1px solid rgba(60, 55, 45, 0.12);
        background: rgba(255, 255, 255, 0.78);
      }
      #boot-fallback .bf-title {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #boot-fallback .bf-desc {
        margin: 0 0 16px;
        font-size: 12px;
        line-height: 1.7;
        color: #7a766c;
      }
      #boot-fallback .bf-btn {
        display: block;
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 8px;
        border-radius: 12px;
        border: none;
        background: #8a7f6d;
        color: #f4f2ec;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      #boot-fallback .bf-ghost {
        background: transparent;
        border: 1px solid rgba(60, 55, 45, 0.12);
        color: #2c2a26;
        margin-bottom: 0;
      }
      @media (prefers-color-scheme: dark) {
        #boot-fallback {
          background: #07080c;
          color: #f2f0ef;
        }
        #boot-fallback .bf-card {
          border-color: rgba(200, 182, 216, 0.18);
          background: rgba(28, 27, 36, 0.72);
        }
        #boot-fallback .bf-desc {
          color: #9a98a3;
        }
        #boot-fallback .bf-btn {
          background: #c8b6d8;
          color: #07080c;
        }
        #boot-fallback .bf-ghost {
          background: transparent;
          border-color: rgba(200, 182, 216, 0.18);
          color: #f2f0ef;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-fallback" hidden>
      <div class="bf-card">
        <p class="bf-title">页面没能加载出来</p>
        <p class="bf-desc">
          多半是网络或缓存的问题。你的习惯记录保存在本机，不会因为加载失败而丢失。
        </p>
        <button class="bf-btn" onclick="location.reload()">重新加载</button>
        <button class="bf-btn bf-ghost" onclick="__hardReload()">强制更新（清缓存）</button>
      </div>
    </div>

    <script>
      // 启动兜底：10 秒内 React 还没渲染出内容就亮出上面的卡片
      window.__bootTimer = setTimeout(function () {
        var el = document.getElementById('boot-fallback')
        if (el) el.removeAttribute('hidden')
      }, 10000)

      function __hardReload() {
        var tasks = []
        try {
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(
                  keys.map(function (k) {
                    return caches.delete(k)
                  }),
                )
              }),
            )
          }
        } catch (e) {}
        try {
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(
                  regs.map(function (r) {
                    return r.unregister()
                  }),
                )
              }),
            )
          }
        } catch (e) {}
        Promise.all(tasks)
          .catch(function () {})
          .then(function () {
            location.replace(location.pathname)
          })
      }
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
